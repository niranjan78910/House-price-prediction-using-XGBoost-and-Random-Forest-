name: Python API tests

on:
  push:
    branches: [main, portfolio-improvements-2026]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install "flask==2.3.3"
      - name: Check Python module syntax
        run: python -m py_compile ai-model/app.py ai-model/predictor.py ai-model/model_training.py
      - name: Run isolated API tests
        run: python -m unittest discover -s ai-model/tests -p "test_*.py" -v
